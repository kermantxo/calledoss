# CARGA HISTÓRICA de resultados de 2026 (proceso único).
# Trabaja en tandas de hasta 45 minutos, guarda lo conseguido en la rama "datos" y se relanza
# sola hasta terminar (así no bloquea durante horas el modo directo). Se puede relanzar a mano:
# continúa donde lo dejó y solo reintenta lo que falta.
name: Carga histórica

on:
  workflow_dispatch:

concurrency:
  group: datos-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tanda:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Traer la rama de datos
        run: git clone --depth 1 --branch datos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Navegador sin ventana (solo para faalive, la web de la Federación Andaluza)
        run: python -m playwright install --with-deps chromium

      - name: Buscar resultados (una tanda)
        env:
          DATA_DIR: datos
          BACKFILL_MAX_MINUTES: "45"
        run: python -m pipeline.run backfill

      - name: Guardar
        run: |
          bash .github/scripts/push-datos.sh "carga histórica - tanda"

      - name: ¿Quedan competiciones? Lanzar la siguiente tanda
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(cat backfill_remaining.txt 2>/dev/null || echo 0)
          echo "Quedan: $LEFT"
          if [ "$LEFT" -gt 0 ]; then gh workflow run historico.yml --ref main; fi
