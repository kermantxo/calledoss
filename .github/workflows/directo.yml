# Modo En Directo: UNA comprobación rápida por ejecución (nunca un bucle esperando).
# La lanza el Worker de Cloudflare cada 3 minutos solo si hay una ventana de directo activa;
# este cron de GitHub cada 5 minutos es la red de seguridad. Si no hay nada en directo,
# termina en unos segundos sin instalar nada.
name: Directo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Grupo propio: el directo no espera a la carga histórica ni al chequeo diario.
# Si coinciden, el guardado se reintenta integrando los cambios del otro (ver push-datos.sh).
concurrency:
  group: directo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            .github

      - name: Traer la rama de datos
        run: git clone --depth 1 --branch datos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos

      - name: ¿Hay directo ahora?
        id: check
        run: python3 .github/scripts/live-window.py datos/live_plan.json >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - if: steps.check.outputs.active == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Comprobar fuentes (una vez)
        if: steps.check.outputs.active == 'true'
        env:
          DATA_DIR: datos
        run: python -m pipeline.run live

      - name: Guardar
        if: steps.check.outputs.active == 'true'
        run: bash .github/scripts/push-datos.sh "directo"
