# Actualización automática de datos (calendario, resultados, destacados, plan de directo).
# Todo es código normal (scrapers en Python), sin llamadas a IA.
# Los datos se guardan en la rama "datos" (así la web no se vuelve a publicar con cada cambio).
name: Datos

on:
  schedule:
    - cron: "15 4 * * *"          # diario completo (06:15 en verano / 05:15 en invierno, hora de Madrid)
    - cron: "5 9-23 * * *"        # resultados: cada hora de 11:00 a 01:00 (hora de Madrid en verano)
    - cron: "40 10,15,19 * * *"   # previas: listas de inscritos, 3 veces más al día
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | results | plan | revisar | previas | ranking | paginas"
        default: "daily"
        required: true

concurrency:
  group: datos-writer   # nunca dos tareas escribiendo a la vez
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Traer la rama de datos
        run: |
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git clone --depth 1 --branch datos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
          else
            mkdir datos && cd datos && git init -b datos && cp ../data/*.json . 2>/dev/null || true
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Navegador sin ventana (solo para faalive, la web de la Federación Andaluza)
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar
        env:
          DATA_DIR: datos
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "15 4 * * *") MODE=daily ;;
              "40 10,15,19 * * *") MODE=previas ;;
              *) MODE=results ;;
            esac
          fi
          python -m pipeline.run "$MODE"

      - name: Guardar cambios en la rama datos
        run: |
          bash .github/scripts/push-datos.sh "datos - ${{ github.event.inputs.mode || 'automático' }}"

      # Una vez al día: páginas de resultados de cada competición (para Google) y sitemap.xml,
      # guardadas en main (la rama que publica Cloudflare). Solo en el proceso diario, para no
      # publicar la web cada hora.
      - name: Páginas de resultados para Google
        if: github.event.schedule == '15 4 * * *' || github.event.inputs.mode == 'daily' || github.event.inputs.mode == 'paginas'
        env:
          DATA_DIR: datos
        run: |
          [ "${{ github.event.inputs.mode }}" = "paginas" ] || python -m pipeline.run paginas
          git config user.name "calledoss-bot"
          git config user.email "calledoss-bot@users.noreply.github.com"
          git add public/resultados public/en/results public/sitemap.xml sitemap.xml
          if git diff --cached --quiet; then echo "Sin cambios en las páginas"; exit 0; fi
          git commit -q -m "Páginas de resultados (automático)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "No se pudieron subir las páginas" >&2; exit 1
